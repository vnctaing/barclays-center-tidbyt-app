app = "barclays-tidbyt"
primary_region = "ewr"

[env]
  ADDR = ":8080"
  DATA_DIR = "/data"
  SCRAPE_INTERVAL = "20m"
  # Exit this long after the last request so the machine stops and stops billing.
  IDLE_EXIT = "20s"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[restart]]
  policy = "on-failure"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
